<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e3a5c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ShareMint">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/images/logo192.png">
    <title>{% block title %}ShareMint{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css?v=52">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="crypto-bg"></div>
    {% block body %}{% endblock %}
    <script src="/static/js/main.js?v=4"></script>
    <script src="/static/js/numeric_input.js?v=1"></script>
    <script src="/static/js/flash-messages.js?v=2"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch(function () {});
        });
    }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>

{% extends "layouts/auth.html" %}

{% block title %}忘记密码 · ShareMint{% endblock %}

{% block content %}
<section class="auth-card crypto-glow">
    <div class="auth-card__header">
        <div class="auth-logo">{% include "includes/icon_lock.html" %}</div>
        <h1>忘记密码</h1>
        <p>输入用户名或注册邮箱，我们将发送密码重置链接。</p>
    </div>

    <form method="post" class="form-stack" id="forgot-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="identifier">用户名 / 邮箱</label>
            <input type="text" name="identifier" id="identifier" required autofocus
                   value="{{ identifier|default:'' }}" autocomplete="username"
                   placeholder="请输入用户名或邮箱">
        </div>
        <input type="submit" class="btn btn-primary btn-block btn-glow" value="发送重置链接">
    </form>

    <p class="login-hint text-muted">
        <a href="{% url 'authentication:login' %}">← 返回登录</a>
    </p>
</section>
{% endblock %}

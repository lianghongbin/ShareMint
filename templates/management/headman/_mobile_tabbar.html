<nav class="mobile-tabbar{% if is_locked %} mobile-tabbar--3{% endif %}" aria-label="主导航">
    <a href="{% url 'management:headman_dashboard' %}" aria-label="概览"
       class="mobile-tab {% if current_url_name == 'headman_dashboard' %}is-active{% endif %}">
        <span class="mobile-tab__icon">{% include "includes/icon_chart.html" %}</span>
        <span class="mobile-tab__label">概览</span>
    </a>
    <a href="{% url 'management:headman_member_list' %}" aria-label="成员"
       class="mobile-tab {% if current_url_name == 'headman_member_list' or current_url_name == 'headman_member_detail' or current_url_name == 'headman_add_member' or current_url_name == 'headman_member_import_export' %}is-active{% endif %}">
        <span class="mobile-tab__icon">{% include "includes/icon_users.html" %}</span>
        <span class="mobile-tab__label">成员</span>
    </a>
    {% if not is_locked %}
    <a href="{% url 'management:headman_add_investment' %}" aria-label="投资"
       class="mobile-tab {% if current_url_name == 'headman_add_investment' or current_url_name == 'headman_add_member_investment' %}is-active{% endif %}">
        <span class="mobile-tab__icon">{% include "includes/icon_coin.html" %}</span>
        <span class="mobile-tab__label">投资</span>
    </a>
    {% endif %}
    <a href="{% url 'management:headman_profile' %}" aria-label="我的"
       class="mobile-tab {% if current_url_name == 'headman_profile' or current_url_name in account_url_names %}is-active{% endif %}">
        <span class="mobile-tab__icon">{% include "includes/icon_settings.html" %}</span>
        <span class="mobile-tab__label">我的</span>
    </a>
</nav>
